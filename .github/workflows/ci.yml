name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # 이 잡은 push하지 않는다 — npx로 받는 Lighthouse 전이 의존성이 .git/config의 토큰을 읽을 길을 닫는다 (security-reviewer 2026-09-07)
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (OpenNext for Cloudflare Workers)
        run: npx opennextjs-cloudflare build
        env:
          NEXT_PUBLIC_NCP_CLIENT_ID: dummy-for-build

      # 프리렌더 결과(OG 카드 75장 등)를 정적 에셋 캐시로 복사 — build는 안 하고 preview/upload/deploy만 한다.
      # 스모크가 실제 배포와 같은 길(정적 서빙, satori 재실행 없음)을 타게 한다 (decisions 2026-09-07 OG 빌드 시 생성)
      - name: Populate static assets cache
        run: npx opennextjs-cloudflare populateCache local

      # 스모크 = 빌드된 워커가 workerd에서 실제로 기동하고 /가 200 + "새우맵"을 돌려주는지 (decisions.md 2026-09-01 스모크 정의)
      - name: Smoke (workerd boots and serves /)
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          npx wrangler dev --port 8787 --log-level warn > wrangler.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8787/ -o smoke.html; then break; fi
            sleep 2
          done
          if ! grep -q "새우맵" smoke.html 2>/dev/null; then
            echo "::error::smoke failed — worker did not serve /"; tail -50 wrangler.log; exit 1
          fi
          echo "smoke ok: $(wc -c < smoke.html) bytes"
          # Phase 2·5: /place/[id] — 있는 가게는 상호 + og:title, 없는 id는 HTTP 404 + not-found 카피 (decisions 2026-09-07)
          curl -sf http://localhost:8787/place/p018 -o smoke-place.html
          if ! grep -q "뚝섬포구" smoke-place.html 2>/dev/null || ! grep -q 'property="og:title" content="뚝섬포구"' smoke-place.html; then
            echo "::error::smoke failed — /place/p018 did not render the place + og:title"; tail -50 wrangler.log; exit 1
          fi
          code=$(curl -s -o smoke-404.html -w '%{http_code}' http://localhost:8787/place/nope)
          if [ "$code" != "404" ] || ! grep -q "가게를 찾을 수 없어요" smoke-404.html 2>/dev/null; then
            echo "::error::smoke failed — /place/nope expected 404 + not-found copy, got $code"; tail -50 wrangler.log; exit 1
          fi
          # Phase 5: /gu/[name] SSR(상호가 HTML에), 비서울은 404, sitemap·robots
          curl -sf "http://localhost:8787/gu/%EB%A7%88%ED%8F%AC%EA%B5%AC" -o smoke-gu.html
          if ! grep -q "마포구 새우구이" smoke-gu.html 2>/dev/null || ! grep -q "서담해물" smoke-gu.html; then
            echo "::error::smoke failed — /gu/마포구 did not SSR the gu list"; tail -50 wrangler.log; exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8787/gu/nope)
          [ "$code" = "404" ] || { echo "::error::smoke failed — /gu/nope expected 404, got $code"; exit 1; }
          curl -sf http://localhost:8787/sitemap.xml | grep -q "/gu/" || { echo "::error::smoke failed — sitemap.xml missing gu entries"; exit 1; }
          curl -sf http://localhost:8787/robots.txt | grep -q "sitemap.xml" || { echo "::error::smoke failed — robots.txt missing sitemap"; exit 1; }
          # Phase 5: next/og 카드 — 동적 세그먼트의 이미지 URL은 해시 쿼리가 붙으므로 페이지의 og:image에서 읽는다
          for page in / /place/p018 "/gu/%EB%A7%88%ED%8F%AC%EA%B5%AC"; do
            og=$(curl -s "http://localhost:8787$page" | grep -o 'property="og:image" content="[^"]*"' | head -1 | sed 's/.*content="//; s/"$//' | sed -E 's|^https?://[^/]+||')
            type=$(curl -s -o /dev/null -w '%{content_type}' "http://localhost:8787$og")
            case "$type" in image/png*) ;; *) echo "::error::smoke failed — og:image for $page ($og) returned $type"; tail -50 wrangler.log; exit 1;; esac
          done
          echo "smoke ok: /place/p018(+og) · /place/nope 404 · /gu/마포구 · /gu/nope 404 · sitemap · robots · og 3종"

      # Phase 5: 모바일 LCP 예산 (roadmap). 같은 workerd(:8787)에 Lighthouse. NCP 키가 dummy라 지도는 에러 상태 — 우리 셸의 LCP를 잰다.
      # 수치는 로컬 workerd 실측으로 정했다 (decisions 2026-09-07). @lhci/cli는 의존성이 아니라 npx로.
      - name: Lighthouse (mobile LCP budget)
        run: npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.json

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse
          path: .lighthouseci
          # 숨김 경로(.lighthouseci)는 v4.4부터 기본 제외 — 첫 발화에서 "No files were found"로 빈 채 통과했다(PR #9).
          # 없으면 error: 리포트가 안 남는 걸 조용히 넘기지 않는다 (하네스 발화 검증 규칙)
          include-hidden-files: true
          if-no-files-found: error

  # Lighthouse 점수를 PR 코멘트로 (roadmap 백로그 — decisions 2026-09-07 "다음 코드 PR에 커밋 하나로").
  # 지금까지는 아티팩트를 내려받아야 점수가 보였다. check 잡과 나누는 이유는 권한이다: 그 잡은 npx로
  # Lighthouse 전이 의존성을 받으므로 쓰기 토큰을 같은 환경에 두지 않는다(persist-credentials: false와 같은 이유).
  # 예산에 걸려 check가 실패했을 때가 점수를 가장 보고 싶은 때라 always()로 돈다.
  lighthouse-comment:
    if: always() && github.event_name == 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/lighthouse-comment.mjs
            scripts/pr-upsert-comment.sh
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        id: reports
        continue-on-error: true
        with:
          name: lighthouse
          path: .lighthouseci

      - name: Comment Lighthouse table
        if: steps.reports.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          node scripts/lighthouse-comment.mjs .lighthouseci > comment.md
          scripts/pr-upsert-comment.sh "$PR" comment.md

  # PR → 프리뷰 버전 업로드 (배포 아님). 고정 별칭 preview → https://preview-saeu-map.saeu-map.workers.dev
  # 시크릿이 없으면 실패 대신 건너뛴다 (decisions.md 2026-09-01 자동 배포).
  preview:
    if: github.event_name == 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: preview-upload
      cancel-in-progress: true
    steps:
      - name: Gate on Cloudflare secrets
        id: gate
        env:
          ENABLED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' && vars.NEXT_PUBLIC_NCP_CLIENT_ID != '' }}
        run: |
          echo "enabled=$ENABLED" >> "$GITHUB_OUTPUT"
          if [ "$ENABLED" != "true" ]; then
            echo "::notice title=preview skipped::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID (secrets) 또는 NEXT_PUBLIC_NCP_CLIENT_ID (variable) 미등록 — 프리뷰 업로드 건너뜀"
          fi

      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - if: steps.gate.outputs.enabled == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - if: steps.gate.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build + upload preview version
        if: steps.gate.outputs.enabled == 'true'
        shell: bash # 명시해야 -o pipefail이 켜진다 (기본 셸은 pipefail 없음 → `| tee`가 실패를 삼킴)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_NCP_CLIENT_ID: ${{ vars.NEXT_PUBLIC_NCP_CLIENT_ID }}
          # 프리뷰의 metadataBase·sitemap·og:image가 프리뷰 URL을 가리키게 (서버 전용, decisions 2026-09-07)
          SITE_URL: https://preview-saeu-map.saeu-map.workers.dev
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # opennextjs-cloudflare가 인자를 따옴표 없이 sh에 넘기므로 메시지에 공백·특수문자 금지.
          # --var: 런타임 SITE_URL은 셸 env가 아니라 워커 변수에서 읽힌다(OpenNext populateProcessEnv) — env는 빌드 시 정적 robots.txt용
          pnpm run upload --preview-alias preview --var SITE_URL:https://preview-saeu-map.saeu-map.workers.dev --message "pr${{ github.event.pull_request.number }}-${HEAD_SHA::7}" 2>&1 | tee upload.log
          # wrangler가 별칭 URL을 찍지 않았으면 업로드가 안 된 것 — 여기서 확실히 실패시킨다
          grep -q "Version Preview Alias URL" upload.log || { echo "::error::preview upload did not produce an alias URL"; exit 1; }

      - name: Comment preview URL on PR
        if: steps.gate.outputs.enabled == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          URL=$(grep -oE 'https://preview-[a-z0-9-]+\.[a-z0-9-]+\.workers\.dev' upload.log | head -1)
          [ -n "$URL" ] || { echo "::error::alias URL not found in upload.log"; exit 1; }
          # 첫 줄은 표식 — 한 PR에 봇 코멘트가 둘이라 --edit-last로는 서로를 덮어쓴다 (2026-09-08)
          {
            echo "<!-- preview-url -->"
            echo "프리뷰: ${URL} (alias \`preview\`, 커밋 ${HEAD_SHA::7}) — 같은 PR의 새 커밋이 이 URL을 덮어씁니다."
          } > preview-comment.md
          scripts/pr-upsert-comment.sh "$PR" preview-comment.md

  # main push → 프로덕션 배포. check 통과가 선행 조건 (Workers Builds 대신 GH Actions인 이유).
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Gate on Cloudflare secrets
        id: gate
        env:
          ENABLED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' && vars.NEXT_PUBLIC_NCP_CLIENT_ID != '' }}
        run: |
          echo "enabled=$ENABLED" >> "$GITHUB_OUTPUT"
          if [ "$ENABLED" != "true" ]; then
            echo "::notice title=deploy skipped::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID (secrets) 또는 NEXT_PUBLIC_NCP_CLIENT_ID (variable) 미등록 — 수동 pnpm run deploy 필요"
          fi

      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - if: steps.gate.outputs.enabled == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - if: steps.gate.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build + deploy to Cloudflare Workers
        if: steps.gate.outputs.enabled == 'true'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_NCP_CLIENT_ID: ${{ vars.NEXT_PUBLIC_NCP_CLIENT_ID }}
        run: pnpm run deploy
