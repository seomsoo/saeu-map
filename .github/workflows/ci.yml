name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (OpenNext for Cloudflare Workers)
        run: npx opennextjs-cloudflare build
        env:
          NEXT_PUBLIC_NCP_CLIENT_ID: dummy-for-build

  # PR → 프리뷰 버전 업로드 (배포 아님). 고정 별칭 preview → https://preview-saeu-map.saeu-map.workers.dev
  # 시크릿이 없으면 실패 대신 건너뛴다 (decisions.md 2026-09-01 자동 배포).
  preview:
    if: github.event_name == 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: preview-upload
      cancel-in-progress: true
    steps:
      - name: Gate on Cloudflare secrets
        id: gate
        env:
          ENABLED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          echo "enabled=$ENABLED" >> "$GITHUB_OUTPUT"
          if [ "$ENABLED" != "true" ]; then
            echo "::notice title=preview skipped::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 미등록 — 프리뷰 업로드 건너뜀"
          fi

      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - if: steps.gate.outputs.enabled == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - if: steps.gate.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build + upload preview version
        if: steps.gate.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_NCP_CLIENT_ID: ${{ vars.NEXT_PUBLIC_NCP_CLIENT_ID }}
        run: |
          pnpm run upload --preview-alias preview --message "PR #${{ github.event.pull_request.number }} ${GITHUB_SHA::7}" 2>&1 | tee upload.log

      - name: Comment preview URL on PR
        if: steps.gate.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          URL=$(grep -oE 'https://preview-[a-z0-9-]+\.[a-z0-9-]+\.workers\.dev' upload.log | head -1)
          URL=${URL:-https://preview-saeu-map.saeu-map.workers.dev}
          BODY="프리뷰: ${URL} (alias \`preview\`, 커밋 ${GITHUB_SHA::7}) — 같은 PR의 새 커밋이 이 URL을 덮어씁니다."
          gh pr comment "$PR" --body "$BODY" --edit-last --create-if-none \
            || gh pr comment "$PR" --body "$BODY"

  # main push → 프로덕션 배포. check 통과가 선행 조건 (Workers Builds 대신 GH Actions인 이유).
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Gate on Cloudflare secrets
        id: gate
        env:
          ENABLED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          echo "enabled=$ENABLED" >> "$GITHUB_OUTPUT"
          if [ "$ENABLED" != "true" ]; then
            echo "::notice title=deploy skipped::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 미등록 — 수동 pnpm deploy 필요"
          fi

      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - if: steps.gate.outputs.enabled == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - if: steps.gate.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build + deploy to Cloudflare Workers
        if: steps.gate.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_NCP_CLIENT_ID: ${{ vars.NEXT_PUBLIC_NCP_CLIENT_ID }}
        run: pnpm run deploy
