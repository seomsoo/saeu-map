name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Phase 6: DB 골격 검사 — 마이그레이션이 깨끗한 DB에 들어가고, RLS·권한 pgTAP가 통과하고, 생성 타입이 최신이고, advisors가 0건.
  # check와 나란히 돈다(각자 로컬 Supabase). preview·deploy는 둘 다 통과해야 한다.
  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.117.0 # 로컬과 같은 판 — gen types 결과가 판마다 달라 diff가 흔들린다

      - name: Start local Supabase (migrations + seed.sql)
        run: supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: pgTAP (RLS · 권한 · RPC)
        run: supabase test db

      - name: Generated types are current (pnpm db:types)
        run: |
          supabase gen types typescript --local --schema public > /tmp/database.types.ts
          diff -u lib/db/database.types.ts /tmp/database.types.ts || { echo "::error::lib/db/database.types.ts is stale — run pnpm db:types and commit"; exit 1; }

      - name: Advisors (security · performance) — 0건이 기준
        run: |
          supabase db advisors --local --type all --level warn --output-format json > advisors.json
          python3 -c 'import json, sys; r = json.load(open("advisors.json"))["results"]; print(json.dumps(r, indent=1, ensure_ascii=False)); sys.exit(1 if r else 0)'

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # 이 잡은 push하지 않는다 — npx로 받는 Lighthouse 전이 의존성이 .git/config의 토큰을 읽을 길을 닫는다 (security-reviewer 2026-09-07)
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Phase 6: 빌드(OG 프리렌더)와 스모크가 **실 DB 경로**를 지난다 — 로컬 Supabase(마이그레이션 + seed.sql 가게 60). 쓰지 않는 컨테이너는 뺀다.
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.117.0 # 로컬과 같은 판 — gen types 결과가 판마다 달라 diff가 흔들린다

      - name: Start local Supabase (migrations + seed.sql)
        run: supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Wire local Supabase into the build and the worker
        shell: bash
        run: |
          set -a; eval "$(supabase status -o env)"; set +a
          # 빌드(t3-env 검증 + 프리렌더)와 스모크 스크립트(psql)용. Turnstile은 테스트 키(항상 통과), salt는 비밀이 아닌 CI 상수
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "DB_URL=$DB_URL"
            echo "NEXT_PUBLIC_TURNSTILE_SITE_KEY=1x00000000000000000000BB"
            echo "TURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA"
            echo "IP_HASH_SALT=ci-only-salt-not-a-secret-0000000000"
          } >> "$GITHUB_ENV"
          # wrangler dev(스모크)는 셸 env가 아니라 .dev.vars를 읽는다(gitignore)
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "TURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA"
            echo "IP_HASH_SALT=ci-only-salt-not-a-secret-0000000000"
          } > .dev.vars

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (OpenNext for Cloudflare Workers)
        run: npx opennextjs-cloudflare build
        env:
          NEXT_PUBLIC_NCP_CLIENT_ID: dummy-for-build

      # 프리렌더 결과(OG 카드 75장 등)를 정적 에셋 캐시로 복사 — build는 안 하고 preview/upload/deploy만 한다.
      # 스모크가 실제 배포와 같은 길(정적 서빙, satori 재실행 없음)을 타게 한다 (decisions 2026-09-07 OG 빌드 시 생성)
      - name: Populate static assets cache
        run: npx opennextjs-cloudflare populateCache local

      # 스모크 = 빌드된 워커가 workerd에서 기동하고 실 DB로 페이지를 내는지 — 내용은 scripts/smoke.sh(로컬과 같은 스크립트).
      # nodejs_compat만 주면 global_fetch_strictly_public이 빠져 워커가 127.0.0.1의 로컬 Supabase를 부를 수 있다(실서비스 설정은 그대로, runbook 3절)
      - name: Smoke (workerd boots and serves pages from the DB)
        id: smoke
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          npx wrangler dev --port 8787 --log-level warn --compatibility-flags nodejs_compat > wrangler.log 2>&1 &
          scripts/smoke.sh http://localhost:8787

      # Phase 5: 모바일 LCP 예산 (roadmap). 같은 workerd(:8787)에 Lighthouse. NCP 키가 dummy라 지도는 에러 상태 — 우리 셸의 LCP를 잰다.
      # 수치는 로컬 workerd 실측으로 정했다 (decisions 2026-09-07). @lhci/cli는 의존성이 아니라 npx로.
      - name: Lighthouse (mobile LCP budget)
        env:
          PLACE_ID: ${{ steps.smoke.outputs.place_id }}
        run: |
          sed "s/__PLACE_ID__/$PLACE_ID/" lighthouserc.json > lighthouserc.ci.json
          npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.ci.json

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse
          path: .lighthouseci
          # 숨김 경로(.lighthouseci)는 v4.4부터 기본 제외 — 첫 발화에서 "No files were found"로 빈 채 통과했다(PR #9).
          # 없으면 error: 리포트가 안 남는 걸 조용히 넘기지 않는다 (하네스 발화 검증 규칙)
          include-hidden-files: true
          if-no-files-found: error

  # Lighthouse 점수를 PR 코멘트로 (roadmap 백로그 — decisions 2026-09-07 "다음 코드 PR에 커밋 하나로").
  # 지금까지는 아티팩트를 내려받아야 점수가 보였다. check 잡과 나누는 이유는 권한이다: 그 잡은 npx로
  # Lighthouse 전이 의존성을 받으므로 쓰기 토큰을 같은 환경에 두지 않는다(persist-credentials: false와 같은 이유).
  # 예산에 걸려 check가 실패했을 때가 점수를 가장 보고 싶은 때라 always()로 돈다.
  # **트리거는 pull_request여야 한다** — pull_request_target으로 바꾸면 포크 PR의 코드를
  # 쓰기 토큰과 함께 실행하게 된다 (security-reviewer 2026-09-08).
  lighthouse-comment:
    if: always() && github.event_name == 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/lighthouse-comment.mjs
            scripts/pr-upsert-comment.sh
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        id: reports
        continue-on-error: true
        with:
          name: lighthouse
          path: .lighthouseci

      - name: Comment Lighthouse table
        if: steps.reports.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          node scripts/lighthouse-comment.mjs .lighthouseci > comment.md
          scripts/pr-upsert-comment.sh "$PR" comment.md

  # PR → 프리뷰 버전 업로드 (배포 아님). 고정 별칭 preview → https://preview-saeu-map.saeu-map.workers.dev
  # 시크릿이 없으면 실패 대신 건너뛴다 (decisions.md 2026-09-01 자동 배포).
  preview:
    if: github.event_name == 'pull_request'
    needs: [check, db]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: preview-upload
      cancel-in-progress: true
    steps:
      - name: Gate on Cloudflare secrets
        id: gate
        env:
          ENABLED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' && secrets.SUPABASE_URL != '' && secrets.SUPABASE_PUBLISHABLE_KEY != '' && vars.NEXT_PUBLIC_NCP_CLIENT_ID != '' && vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY != '' }}
        run: |
          echo "enabled=$ENABLED" >> "$GITHUB_OUTPUT"
          if [ "$ENABLED" != "true" ]; then
            echo "::notice title=preview skipped::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID / SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY (secrets) 또는 NEXT_PUBLIC_NCP_CLIENT_ID / NEXT_PUBLIC_TURNSTILE_SITE_KEY (variables) 미등록 — 프리뷰 업로드 건너뜀 (runbook 3c)"
          fi

      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - if: steps.gate.outputs.enabled == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - if: steps.gate.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build + upload preview version
        if: steps.gate.outputs.enabled == 'true'
        shell: bash # 명시해야 -o pipefail이 켜진다 (기본 셸은 pipefail 없음 → `| tee`가 실패를 삼킴)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_NCP_CLIENT_ID: ${{ vars.NEXT_PUBLIC_NCP_CLIENT_ID }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          # 프리뷰의 metadataBase·sitemap·og:image가 프리뷰 URL을 가리키게 (서버 전용, decisions 2026-09-07)
          SITE_URL: https://preview-saeu-map.saeu-map.workers.dev
          # 빌드의 OG 프리렌더가 prod DB를 읽는다(anon 읽기) — URL·publishable은 GH secret으로(variable이면 --var·로그에 찍힌다, 최종 보안 리뷰 #3).
          # 런타임 값은 전부 워커 secret(wrangler secret put — 버전 간 유지)이고, TURNSTILE·salt는 t3-env 검증을 지나기 위한 더미다(runbook 1절)
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          TURNSTILE_SECRET_KEY: build-only-dummy
          IP_HASH_SALT: build-only-dummy-salt-0000000000
          # 비우면 Sentry가 꺼진 채 빌드된다(공개값, 빌드에 박힌다 — 커밋 9)
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # opennextjs-cloudflare가 인자를 따옴표 없이 sh에 넘기므로 메시지에 공백·특수문자 금지.
          # --var: 런타임 값은 셸 env가 아니라 워커 변수에서 읽힌다(OpenNext populateProcessEnv) — env는 빌드 시 정적 robots.txt·프리렌더용.
          # PREVIEW_READONLY=1: 프리뷰는 prod DB를 읽기만 한다(decisions 2026-09-10 #7) — 발화 확인은 프리뷰에서 찜 한 번(read only 토스트)
          pnpm run upload --preview-alias preview \
            --var SITE_URL:https://preview-saeu-map.saeu-map.workers.dev \
            --var PREVIEW_READONLY:1 \
            --message "pr${{ github.event.pull_request.number }}-${HEAD_SHA::7}" 2>&1 | tee upload.log
          # wrangler가 별칭 URL을 찍지 않았으면 업로드가 안 된 것 — 여기서 확실히 실패시킨다
          grep -q "Version Preview Alias URL" upload.log || { echo "::error::preview upload did not produce an alias URL"; exit 1; }

      - name: Comment preview URL on PR
        if: steps.gate.outputs.enabled == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          URL=$(grep -oE 'https://preview-[a-z0-9-]+\.[a-z0-9-]+\.workers\.dev' upload.log | head -1)
          [ -n "$URL" ] || { echo "::error::alias URL not found in upload.log"; exit 1; }
          # 첫 줄은 표식 — 한 PR에 봇 코멘트가 둘이라 --edit-last로는 서로를 덮어쓴다 (2026-09-08)
          {
            echo "<!-- preview-url -->"
            echo "프리뷰: ${URL} (alias \`preview\`, 커밋 ${HEAD_SHA::7}) — 같은 PR의 새 커밋이 이 URL을 덮어씁니다."
          } > preview-comment.md
          scripts/pr-upsert-comment.sh "$PR" preview-comment.md

  # main push → 프로덕션 배포. check 통과가 선행 조건 (Workers Builds 대신 GH Actions인 이유).
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, db]
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Gate on Cloudflare secrets
        id: gate
        env:
          ENABLED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' && secrets.SUPABASE_URL != '' && secrets.SUPABASE_PUBLISHABLE_KEY != '' && vars.NEXT_PUBLIC_NCP_CLIENT_ID != '' && vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY != '' }}
        run: |
          echo "enabled=$ENABLED" >> "$GITHUB_OUTPUT"
          if [ "$ENABLED" != "true" ]; then
            echo "::notice title=deploy skipped::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID / SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY (secrets) 또는 NEXT_PUBLIC_NCP_CLIENT_ID / NEXT_PUBLIC_TURNSTILE_SITE_KEY (variables) 미등록 — 수동 pnpm run deploy 필요 (runbook 3c)"
          fi

      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - if: steps.gate.outputs.enabled == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - if: steps.gate.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build + deploy to Cloudflare Workers
        if: steps.gate.outputs.enabled == 'true'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_NCP_CLIENT_ID: ${{ vars.NEXT_PUBLIC_NCP_CLIENT_ID }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          # 빌드용 — 런타임 값(SUPABASE_URL·PUBLISHABLE_KEY·SECRET_KEY·TURNSTILE_SECRET_KEY·IP_HASH_SALT·DISCORD_WEBHOOK_URL)은 전부 wrangler secret이다(runbook 3절)
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          TURNSTILE_SECRET_KEY: build-only-dummy
          IP_HASH_SALT: build-only-dummy-salt-0000000000
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          # 소스맵 업로드 — 없으면(빈 값) next.config.ts가 업로드를 끈다. 실서비스 빌드에서만 올린다(프리뷰·check는 안 올린다)
          SENTRY_UPLOAD_TOKEN: ${{ secrets.SENTRY_UPLOAD_TOKEN }}
        run: pnpm run deploy
