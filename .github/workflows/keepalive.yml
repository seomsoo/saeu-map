name: keepalive

# Supabase 무료 프로젝트는 7일 동안 요청이 없으면 잠든다(decisions 2026-09-10 #7). 홈은 요청 시 DB를 읽으므로(connection())
# 하루 한 번의 이 요청이 곧 활동이다. 매일 09:00 KST(= 00:00 UTC). 리포에 60일간 커밋이 없으면 GitHub가 스케줄을 끈다 — runbook 5절.
# 사용자가 실제로 들어오는 주소(새우맵.kr의 퓨니코드)를 부른다 — workers.dev는 설정 한 줄에 꺼질 수 있다(decisions 2026-09-21).
# 실패하면 디스코드로 알린다(D7, 2026-09-22) — 2026-09-18~21 나흘 빨강을 월간 점검이 못 잡았다. 수동 실행의 `url`은 발화 검증용:
# 없는 주소를 넣어 실패시키면 알림 한 건이 와야 한다.
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      url:
        description: "확인할 주소 (기본 실서비스. 알림 발화 검증은 없는 주소로)"
        default: "https://xn--r02bv8jvof.kr/"
        required: false

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: GET /
        env:
          URL: ${{ inputs.url || 'https://xn--r02bv8jvof.kr/' }}
        run: curl -sf --retry 3 --retry-delay 10 -o /dev/null -w "%{http_code} %{time_total}s\n" "$URL"
      - name: 실패 → 디스코드
        if: failure()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::warning title=keepalive::DISCORD_WEBHOOK_URL secret 없음 — 알림 건너뜀 (runbook 2-6)"
            exit 0
          fi
          # 앱의 관리자 알림과 같은 꼴([머리말] 한 줄 + 링크), 멘션 없음
          printf '{"content":"[keepalive] 새우맵.kr GET / 실패 — Supabase가 잠들 수 있다\\n%s","allowed_mentions":{"parse":[]}}' "$RUN_URL" \
            | curl -sf -H 'content-type: application/json' -d @- "$WEBHOOK"
